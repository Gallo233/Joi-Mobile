name: JoiMobile
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  localPackagesGroup: Packages
configs:
  Debug: debug
  Release: release
packages:
  CompanionCore:
    path: Packages/CompanionCore
  CharacterRuntime:
    path: Packages/CharacterRuntime
  ChatFeature:
    path: Packages/ChatFeature
  MapFeature:
    path: Packages/MapFeature
  OfflinePack:
    path: Packages/OfflinePack
  SyncClient:
    path: Packages/SyncClient
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  JoiMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: JoiMobile
    info:
      path: JoiMobile/Info.plist
      properties:
        CFBundleDisplayName: Joi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 仅在你按住说话时，Joi 才会使用麦克风。
        # The system prompt above this string is Apple's and always says speech
        # data may be sent to Apple, because the permission itself covers server
        # recognition. Flatly denying that on the same screen would read as the
        # app arguing with iOS, so this says what Joi actually does with the
        # permission instead: it only ever asks for the on-device recogniser
        # (DEC-031), and declines voice input rather than taking the uploading
        # path when that is unavailable.
        NSSpeechRecognitionUsageDescription: Joi 只使用本机语音识别；若这台设备无法本机识别，Joi 会关闭语音输入，而不会改用需要上传录音的方式。
        NSLocationWhenInUseUsageDescription: 仅在可见的文化步行或地点请求中，Joi 才会使用你的位置。
        NSCameraUsageDescription: 仅在你主动使用“看见就问”时，Joi 才会使用相机。
        NSPhotoLibraryUsageDescription: Joi 只会读取你为地点提问主动选择的照片。
        # Character packages are user-owned files, so the app both declares the
        # type it can open and exposes its own folder. Without the declaration a
        # `.joi-character` file is not selectable in the document picker at all.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.joi.character-package
            UTTypeDescription: Joi 角色包
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - joi-character
        CFBundleDocumentTypes:
          - CFBundleTypeName: Joi 角色包
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.joi.character-package
        # Local development only: permits http://127.0.0.1 so Backend/mock_server.py
        # can serve the chat contract. Arbitrary loads stay forbidden, so every
        # non-loopback host must still be HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joi.mobile
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: false
        # The mark is generated by Tools/make_app_icon.swift rather than exported
        # from a design file, so every size is redrawn instead of resampled. The
        # catalog holds one 1024 asset plus its dark and tinted appearances; iOS
        # derives the rest and applies its own rounded-rectangle mask, which is
        # why the artwork is full-bleed and square.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CompanionCore
      - package: CharacterRuntime
      - package: ChatFeature
      - package: MapFeature
      - package: OfflinePack
      - package: SyncClient
  JoiMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joi.mobile.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
    dependencies:
      - target: JoiMobile
      - package: CompanionCore
      - package: ChatFeature
schemes:
  JoiMobile:
    build:
      targets:
        JoiMobile: all
        JoiMobileTests: [test]
    test:
      targets:
        - JoiMobileTests
    run:
      config: Debug
    archive:
      config: Release
fileGroups:
  - README.md
  - AGENTS.md
  - docs
  - Contracts
  - Backend
