org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The portable modules are plain JVM. Nothing here needs a large heap, and a
# small one keeps the lane usable on a laptop that is also running a simulator.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

# Required, not optional: every androidx artifact refuses to resolve without it.
# It exists because AGP still supports the pre-androidx support library, and the
# two cannot share a classpath.
android.useAndroidX=true

# One R class per module instead of every dependency's resources being folded
# into the app's. Keeps the build incremental and the R class small.
android.nonTransitiveRClass=true

